<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <meta name="description" content="Something fresh is growing. Stay tuned for our launch." />
  <meta property="og:title" content="Coming Soon" />
  <meta property="og:description" content="Something fresh is growing. Stay tuned for our launch." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green-900: #065D2F;
      --green-700: #0B7A3F;
      --green-600: #34B449;
      --green-300: #8DC63F;
      --cream: #F9FAF6;
      --foreground: #0A1F12;
      --muted: #5A6B5C;
      --white: #ffffff;
      --radius: 0.75rem;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--foreground);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--green-300) 18%, transparent), transparent 40%),
        radial-gradient(circle at 80% 80%, color-mix(in srgb, var(--green-600) 14%, transparent), transparent 45%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 93, 47, 0.08);
      border-radius: calc(var(--radius) + 0.5rem);
      padding: clamp(2rem, 6vw, 3.5rem);
      box-shadow: 0 24px 80px rgba(6, 93, 47, 0.10);
      animation: fadeUp 0.8s ease both;
    }

    .logo {
      width: 184px;
      height: auto;
      margin: 0 auto 2rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0 0 1rem;
    }

    h1 span {
      background: linear-gradient(135deg, var(--green-900) 0%, var(--green-600) 60%, var(--green-300) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lead {
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    @media (min-width: 480px) {
      form {
        flex-direction: row;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input[type="email"] {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(6, 93, 47, 0.16);
      border-radius: var(--radius);
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--foreground);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]::placeholder {
      color: var(--muted);
    }

    input[type="email"]:focus {
      border-color: var(--green-600);
      box-shadow: 0 0 0 3px rgba(52, 180, 73, 0.15);
    }

    button {
      appearance: none;
      border: none;
      border-radius: var(--radius);
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--white);
      cursor: pointer;
      background: linear-gradient(135deg, var(--green-900) 0%, var(--green-600) 100%);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(6, 93, 47, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid var(--green-300);
      outline-offset: 2px;
    }

    .message {
      min-height: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--green-700);
      opacity: 0;
      transition: opacity 0.3s ease;
      margin: 0;
    }

    .message.visible {
      opacity: 1;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

              <stop offset="0.45" stop-color="#34B449"/>

      <h1><span>Coming Soon</span></h1>
      <p class="lead">Something fresh is growing. Enter your email and be the first to know when we launch.</p>

      <form id="notify-form" action="#" novalidate>
        <label for="email" class="sr-only">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit">Notify me</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite">Thanks! We'll keep you posted.</p>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Brand. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('notify-form');
    const msg = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = form.email.value.trim();

      if (!email || !form.email.checkValidity()) {
        msg.textContent = 'Please enter a valid email address.';
        msg.style.color = '#b91c1c';
        msg.classList.add('visible');
        return;
      }

      msg.textContent = 'Thanks! We’ll keep you posted.';
      msg.style.color = '';
      msg.classList.add('visible');
      form.reset();
    });
  </script>
